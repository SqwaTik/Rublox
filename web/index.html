<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rublox</title>
    <link rel="icon" href="img/logo-64.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── Кастомный титлбар ── -->
    <div class="titlebar" id="titlebar">
      <div class="tb-left">
        <img class="tb-logo" src="img/logo-64.png" alt="" />
        <span class="tb-name">Rublox</span>
        <span class="tb-sub">AI Studio</span>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-controls">
        <button class="tb-btn" id="winMin" data-icon="min" title="Minimize"></button>
        <button class="tb-btn" id="winMax" data-icon="square" title="Maximize"></button>
        <button class="tb-btn tb-close" id="winClose" data-icon="close" title="Close"></button>
      </div>
    </div>

    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <button class="new-chat-btn" id="newChat"><span data-icon="plus"></span> <span data-t="newChat">New chat</span></button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-foot">
          <button class="ghost-btn" id="openSettings"><span data-icon="settings"></span> <span data-t="settings">Settings</span></button>
          <button class="ghost-btn" id="installPlugin"><span data-icon="download"></span> <span data-t="installPlugin">Install plugin</span></button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-btn only-mobile" id="toggleSidebar" data-icon="menu"></button>
            <span class="chat-title" id="chatTitle" title="Double-click to rename"></span>
          </div>
          <button class="status-chip disconnected" id="studioStatus">
            <span data-icon="plug"></span> <span id="studioText" data-t="studioOff">Studio: disconnected</span>
          </button>
        </header>

        <section class="chat" id="chat"></section>

        <!-- ── Индикатор работы (как в Claude Code) ── -->
        <div class="worklog hidden" id="worklog">
          <span class="wl-spin">✻</span>
          <span class="wl-text" id="worklogText">Thinking</span>
          <span class="wl-meta" id="worklogMeta"></span>
        </div>

        <footer class="composer">
          <div class="composer-input">
            <div class="suggest hidden" id="suggest"></div>
            <textarea id="input" rows="1" data-t-ph="placeholder" placeholder="Describe a task or type a /command…"></textarea>
            <button class="send-btn" id="send" data-icon="send"></button>
          </div>
          <!-- минипикеры СПРАВА -->
          <div class="composer-bar">
            <div class="spacer"></div>
            <button class="pill pill-ring" id="usagePill" title="Limits">
              <svg class="usage-ring" viewBox="0 0 24 24" width="18" height="18">
                <circle class="ur-track" cx="12" cy="12" r="9" fill="none" stroke-width="3"></circle>
                <circle class="ur-fill" cx="12" cy="12" r="9" fill="none" stroke-width="3"
                  stroke-linecap="round" transform="rotate(-90 12 12)"></circle>
              </svg>
            </button>
            <button class="pill" id="thinkPill"><span data-icon="brain"></span> <span id="thinkPillText">High</span> <span class="chev" data-icon="chevron"></span></button>
            <button class="pill" id="modelPill"><span data-icon="cpu"></span> <span id="modelPillText">No model</span> <span class="chev" data-icon="chevron"></span></button>
          </div>
        </footer>
      </main>
    </div>

    <!-- Поповеры -->
    <div class="popover hidden" id="modelPopover">
      <div class="pop-head">
        <select id="popProvider"></select>
      </div>
      <div class="model-filters" id="modelFilters"></div>
      <input class="pop-search" id="modelSearch" placeholder="Search model…" />
      <div class="pop-list" id="modelList"></div>
    </div>
    <div class="popover hidden" id="thinkPopover"><div class="pop-list" id="thinkList"></div></div>
    <div class="popover hidden" id="usagePopover"><div class="usage-body" id="usageBody"></div></div>

    <!-- Модалка настроек с вкладками -->
    <div class="modal-overlay hidden" id="settingsOverlay">
      <div class="modal">
        <div class="modal-head">
          <div class="tabs">
            <button class="tab active" data-tab="providers" data-t="providers">Providers</button>
            <button class="tab" data-tab="plugins" data-t="plugins">Plugins</button>
            <button class="tab" data-tab="connection" data-t="connection">Connection</button>
            <button class="tab" data-tab="appearance" data-t="appearance">Appearance</button>
            <button class="tab" data-tab="about" data-t="about">About</button>
          </div>
          <button class="icon-btn" id="closeSettings" data-icon="close"></button>
        </div>

        <div class="modal-body">
          <!-- вкладка Providers -->
          <div class="tab-pane active" data-pane="providers">
            <div class="provider-list" id="providerList"></div>
            <h3 data-t="quickTemplates">Quick templates (paste your key)</h3>
            <div class="template-grid" id="templateGrid"></div>
            <hr class="sep" />
            <h3 data-t="addProvider">Add / edit provider</h3>
            <div class="form-grid">
              <label><span data-t="id">ID</span><input id="pf-id" placeholder="my-provider" /></label>
              <label><span data-t="name">Name</span><input id="pf-label" placeholder="My provider" /></label>
              <label><span data-t="protocol">Protocol</span>
                <select id="pf-kind">
                  <option value="multi">Multi (auto-route)</option>
                  <option value="openai">OpenAI-compatible</option>
                  <option value="anthropic">Anthropic</option>
                </select>
              </label>
              <label><span data-t="baseUrl">Base URL</span><input id="pf-baseUrl" placeholder="https://api.example.com/v1" /></label>
              <label><span data-t="apiKey">API key</span><input id="pf-apiKey" type="password" placeholder="sk-..." /></label>
              <label><span data-t="model">Model</span><input id="pf-model" placeholder="optional" /></label>
            </div>
            <div class="form-actions">
              <button class="ghost-btn" id="pf-fetch" data-t="previewModels">Preview models</button>
              <button class="primary-btn" id="pf-save" data-t="save">Save</button>
              <button class="ghost-btn danger" id="pf-delete" data-t="remove">Remove</button>
            </div>
            <select id="pf-models" class="hidden" size="6"></select>
            <div class="form-hint" id="pf-hint"></div>
          </div>

          <!-- вкладка Plugins (ИИ-скиллы) -->
          <div class="tab-pane" data-pane="plugins">
            <p class="form-hint" data-t="pluginsIntro"></p>
            <input id="skill-search" class="skill-search" data-t-ph="pluginsSearch" placeholder="Search plugins…" />
            <div class="skill-list" id="skillList"></div>
            <hr class="sep" />
            <h3 data-t="addPlugin">Add custom skill</h3>
            <div class="form-grid">
              <label><span data-t="name">Name</span><input id="sk-name" placeholder="My skill" /></label>
              <label><span data-t="pluginDesc">Description</span><input id="sk-desc" placeholder="Short description" /></label>
            </div>
            <label class="full"><span data-t="pluginPrompt">Instruction for the AI</span>
              <textarea id="sk-prompt" rows="4" data-t-ph="pluginPromptPh" placeholder="When this skill is on, the AI should…"></textarea>
            </label>
            <div class="form-actions">
              <button class="primary-btn" id="sk-add" data-t="addPlugin">Add custom skill</button>
            </div>
          </div>

          <!-- вкладка Connection -->
          <div class="tab-pane" data-pane="connection">
            <div class="conn-block">
              <span class="conn-label" data-t="serverAddr">Server address</span>
              <div class="conn-row">
                <input id="conn-url" readonly value="http://localhost:8787" />
                <button class="ghost-btn" id="conn-copy-url"><span data-icon="copy"></span></button>
              </div>
            </div>
            <div class="conn-block">
              <span class="conn-label" data-t="bridgeToken">Bridge token</span>
              <div class="conn-row">
                <input id="conn-token" type="text" readonly value="…" />
                <button class="ghost-btn" id="conn-copy-token"><span data-icon="copy"></span> <span data-t="copy">Copy</span></button>
                <button class="ghost-btn" id="conn-regen"><span data-icon="refresh"></span> <span data-t="regenerate">Regenerate</span></button>
              </div>
              <div class="conn-hint" data-t="tokenHint"></div>
            </div>
            <label class="set-row"><span data-t="pcAgentLabel">PC agent when Studio is off</span>
              <input type="checkbox" id="set-pcagent" checked />
            </label>
          </div>

          <!-- вкладка Appearance -->
          <div class="tab-pane" data-pane="appearance">
            <label class="set-row"><span data-t="language">Language</span>
              <select id="set-lang"><option value="en">English</option><option value="ru">Русский</option></select>
            </label>
            <div class="set-row" style="display:block">
              <span data-t="theme">Theme</span>
              <div class="theme-grid" id="theme-grid"></div>
            </div>
          </div>

          <!-- вкладка About -->
          <div class="tab-pane" data-pane="about">
            <div class="about">
              <img src="img/logo.png" class="about-logo" alt="" />
              <h2>Rublox</h2>
              <p data-t="aboutText"></p>
              <p class="about-ver">v0.2.0</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="icons.js"></script>
    <script src="i18n.js"></script>
    <script src="markdown.js"></script>
    <script src="app.js"></script>
  </body>
</html>
